<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central de Ajustes</title>
<style>
  /* Aba "Central de Ajustes" no Chatwoot: o formulário ocupa a aba inteira; uma faixa fina no topo abre em nova aba. */
  :root{
    --bg:#FFFFFF; --txt:#1F2328; --suave:#646B73; --linha:#E2E5E9; --caixa:#F6F7F9; --azul:#2563EB;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#151617; --txt:#ECEDEE; --suave:#9BA1A6; --linha:#2B2D30; --caixa:#1B1C1E; --azul:#60A5FA; color-scheme:dark; }
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--txt);font:400 13px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;display:flex;flex-direction:column}
  .faixa{flex:none;display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:6px 14px;border-bottom:1px solid var(--linha);background:var(--caixa)}
  .faixa span{color:var(--suave);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .faixa a{color:var(--azul);font-weight:600;text-decoration:none;white-space:nowrap}
  .faixa a:hover{text-decoration:underline}
  .faixa a:focus-visible{outline:2px solid var(--azul);outline-offset:2px;border-radius:4px}
  iframe{flex:1;width:100%;border:0;background:#F4F7FC}
  .aviso{padding:22px 24px;display:flex;flex-direction:column;gap:12px;max-width:620px;font-size:14px}
  .aviso h1{margin:0;font-size:17px;font-weight:600}
  .aviso p{margin:0;color:var(--suave)}
  .btn{align-self:flex-start;background:var(--azul);color:#fff;text-decoration:none;font-weight:600;border-radius:8px;padding:10px 16px}
</style>
</head>
<body>
  <!-- faixa sempre visível: plano B se o formulário não carregar dentro do Chatwoot -->
  <div class="faixa" id="faixa" hidden>
    <a id="novaAba" href="#" target="_blank" rel="noopener">Não carregou? Abrir em nova aba ↗</a>
  </div>

  <iframe id="form" title="Central de Ajustes" hidden allow="clipboard-write"></iframe>

  <div class="aviso" id="carregando"><p>Lendo a conversa aberta…</p></div>

  <div class="aviso" id="semConversa" hidden>
    <h1>Registrar ajuste</h1>
    <p>Não foi possível ler a conversa. Abra esta aba de dentro de uma conversa do Chatwoot, ou use o formulário e cole o link manualmente.</p>
    <a id="abrirVazio" class="btn" href="#" target="_blank" rel="noopener">Abrir o formulário</a>
  </div>

<script>
  // App da web da Central de Ajustes
  var URL_FORM = 'https://script.google.com/macros/s/AKfycbwUO15BPz1zV2Y0G2THdUUyhCcDT_bOTDsfLfRyLwQqessllvB0Edo5om15JbtmEuGATw/exec';

  var $ = function (id) { return document.getElementById(id); };
  $('abrirVazio').href = URL_FORM;
  var atual = '';   // conversa carregada no formulário, para não recarregar à toa

  // O Chatwoot manda o contexto ao abrir a aba e sempre que pedimos
  window.addEventListener('message', function (ev) {
    var dado;
    try { dado = typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data; } catch (e) { return; }
    if (!dado || dado.event !== 'appContext' || !dado.data || !dado.data.conversation) return;
    carregar(dado.data);
  });

  function carregar(d) {
    var conv = d.conversation || {};
    var agente = d.currentAgent || {};
    var contato = d.contact || (conv.meta && conv.meta.sender) || {};
    if (!conv.id || !conv.account_id) return;
    var chave = conv.account_id + '/' + conv.id;
    if (chave === atual) return;
    atual = chave;

    var p = new URLSearchParams({
      conta: String(conv.account_id),
      inbox: String(conv.inbox_id || ''),
      conversa: String(conv.id),
      email: String(agente.email || ''),
      contato: String(contato.name || '')
    });
    var url = URL_FORM + '?' + p.toString();

    $('novaAba').href = url;
    $('form').src = url;

    $('carregando').hidden = true;
    $('semConversa').hidden = true;
    $('faixa').hidden = false;
    $('form').hidden = false;
  }

  function pedir() { try { window.parent.postMessage('chatwoot-dashboard-app:fetch-info', '*'); } catch (e) {} }
  pedir();
  // se o Chatwoot reaproveitar a aba ao trocar de conversa, pede o contexto de novo
  window.addEventListener('focus', pedir);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) pedir(); });

  setTimeout(function () {
    if (atual) return;
    $('carregando').hidden = true;
    $('semConversa').hidden = false;
  }, 4000);
</script>
</body>
</html>
